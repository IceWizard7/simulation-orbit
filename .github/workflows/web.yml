name: Web build (GitHub Pages)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Downscale textures for the web
        run: |
          sudo apt-get install -y -qq imagemagick
          mogrify -resize '2048x2048>' -quality 85 resources/*.jpg
          # (optional, sharper sky: resize the star maps from the originals to 4096 instead)

      - name: Build with Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.0
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j "$(nproc)"

      - name: Assemble site
        run: |
          mkdir site
          cp build-web/simulation-orbit.{js,wasm,data} build-web/coi-serviceworker.min.js site/
          cp build-web/simulation-orbit.html site/index.html
          sed -i "s/__DATA_BYTES__/$(stat -c%s build-web/simulation-orbit.data)/" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
