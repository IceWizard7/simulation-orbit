<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- No favico for now -->
    <link rel="icon" href="data:,">

    <!-- GitHub Pages can't send COOP/COEP headers; this service worker adds them (needed for pthreads) -->
    <script src="coi-serviceworker.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <script>
        // Phones: lay out at 800 CSS px and let the browser scale down, so the desktop toolbar fits
        const smallScreen = Math.min(screen.width, screen.height) < 600;
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        const applyViewport = () => {
            if (smallScreen) viewportMeta.content = "width=800, user-scalable=no";
        };
        applyViewport();
    </script>

    <!-- Apple add to homescreen features -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>simulation-orbit</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101318;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh; /* fallback for old browsers */
            height: 100dvh; /* visible height on mobile (browser bars included) */
            outline: none;
            touch-action: none;
        }

        #fullscreen {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 1;
            opacity: 0.5;
        }

        #fullscreen:hover {
            opacity: 1;
        }

        :fullscreen #fullscreen,
        :-webkit-full-screen #fullscreen {
            display: none;
        }

        /* Hide while fullscreen; Esc exits */

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #9aa4b2;
            font: 14px system-ui, sans-serif;
            pointer-events: none;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>
<canvas id="canvas"
        width="900"
        height="900"
        tabindex="-1"
        oncontextmenu="event.preventDefault()">
</canvas>


<textarea id="ime" rows="1" tabindex="-1" aria-hidden="true" autocomplete="off" autocorrect="off" autocapitalize="off"
       spellcheck="false"
       style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; border:0; padding:0; font-size:16px;"></textarea>

<input id="state-file" type="file" accept=".json,application/json" style="display:none">

<div id="status" data-bytes="__DATA_BYTES__">Loading…</div>

<button id="fullscreen" title="Fullscreen">⛶</button>

<script>
    let startupFailed = false; // Emscripten clears the status right after main() has started

    var Module = {
        canvas: document.getElementById("canvas"),

        // simulation-orbit.html?--dt&900&--body-set&all -> argv = ["--dt", "900", "--body-set", "all"]
        arguments: location.search.slice(1).split("&").filter(Boolean).map(decodeURIComponent),
        print: (...args) => console.log(...args),
        printErr: (...args) => {
            const message = args.join(" ");
            console.error(message);

            if (message.startsWith("Error:")) {
                startupFailed = true;
                document.getElementById("status").textContent = message;
            }
        },

        onAbort: (reason) => {
            console.error("Simulation aborted:", reason);
        },

        // Emscripten calls this with e.g. "Downloading data... (1234/9000)" and "" when done
        setStatus: (text) => {
            if (startupFailed) return;

            const el = document.getElementById("status");
            const download = text.match(/^Downloading data\.\.\. \((\d+)\/(\d+)\)/);

            if (download) {
                // Real size from CI; local builds have no number here and use Emscripten's total
                const total = Number(el.dataset.bytes) || Number(download[2]);
                const percent = Math.min(100, Math.floor(100 * download[1] / total));
                el.textContent = `Loading… ${percent}%`;
            } else {
                el.textContent = text;
            }

            el.hidden = !text;
        },
    };

    Module.wheelDeltaY = 0;
    Module.canvas.addEventListener("wheel", (e) => {
        Module.wheelDeltaY += (e.deltaMode === 0) ? e.deltaY : e.deltaY * 33; // lines -> approx. pixels
    }, {passive: true});

    // Last pointer type ("mouse" | "touch" | "pen"): Touch gestures can synthesize right-button events,
    // so C++ ignores the right button for touch and uses a double tap instead
    // Capture phase: Set before any synthesized mouse event reaches GLFW
    Module.lastPointerType = "mouse";
    Module.touchScrollCanceled = false;
    Module.canvas.addEventListener("pointerdown", (e) => {
        Module.lastPointerType = e.pointerType;
        if (e.pointerType === "touch") Module.touchScrollCanceled = !e.isPrimary;
    }, {capture: true});
    Module.canvas.addEventListener("pointercancel", (e) => {
        if (e.pointerType === "touch") Module.touchScrollCanceled = true;
    });

    // Layout-independent zoom keys: Emscripten's GLFW maps by keyCode, and Firefox drops "+" on QWERTZ
    Module.heldKeys = [false, false]; // [zoom in, zoom out]
    const keyActions = {"+": 0, "-": 1}; // numpad +/- also report e.key "+"/"-"
    const heldByCode = new Map(); // e.code -> action (keyup may report another e.key, e.g. "*")
    window.addEventListener("keydown", (e) => {
        const a = keyActions[e.key];
        if (a !== undefined) {
            heldByCode.set(e.code, a);
            Module.heldKeys[a] = true;
        }
    });
    window.addEventListener("keyup", (e) => {
        const a = heldByCode.get(e.code);
        if (a !== undefined) {
            heldByCode.delete(e.code);
            Module.heldKeys[a] = false;
        }
    });
    window.addEventListener("blur", () => {
        heldByCode.clear();
        Module.heldKeys.fill(false);
    });

    // Fullscreen: standard API, WebKit prefix (iPad Safari); unsupported on iPhone -> hide the button
    const fullscreenButton = document.getElementById("fullscreen");
    const root = document.documentElement;
    const requestFullscreen = root.requestFullscreen ?? root.webkitRequestFullscreen;

    if (requestFullscreen) {
        fullscreenButton.addEventListener("click", () => requestFullscreen.call(root)?.catch?.(() => {
        }));
    } else {
        fullscreenButton.hidden = true;
    }

    // Emscripten's GLFW forces the canvas to screen.width * screen.height when entering fullscreen, which exceeds the visible area on displays with a notch
    // A follow-up resize applies the real viewport
    for (const type of ["fullscreenchange", "webkitfullscreenchange"]) {
        document.addEventListener(type, () => {
            requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
        });
    }

    // On-screen keyboard bridge: ImGui text fields live in the canvas, so the browser only shows a keyboard for a focused real <input>
    // iOS allows focus() only inside a user gesture -> touchend
    const ime = document.getElementById("ime");
    Module.wantTextInput = false; // Written by C++ every frame (ImGui's io.WantTextInput)
    Module.pendingChars = []; // Unicode code points -> io.AddInputCharacter
    Module.pendingKeys = []; // 1 = Backspace, 2 = Enter, 3 = Escape -> io.AddKeyEvent

    // Keep one character in the field: otherwise Backspace on an empty input fires no event
    const resetIme = () => {
        ime.value = " ";
        ime.setSelectionRange(1, 1);
    };

    Module.canvas.addEventListener("touchend", () => {
        if (Module.wantTextInput && document.activeElement !== ime) {
            resetIme();
            ime.focus();
        }
    });

    for (const type of ["keydown", "keypress", "keyup"]) {
        window.addEventListener(type, (e) => {
            if (e.target !== ime) return;
            e.stopImmediatePropagation();

            if (type !== "keydown") return;
            if (e.key === "Escape") {
                e.preventDefault();
                Module.pendingKeys.push(3);
            } else if (["Tab", "Home", "End", "ArrowLeft", "ArrowRight",
                "ArrowUp", "ArrowDown"].includes(e.key)) {
                e.preventDefault(); // Keep focus and the caret after the sentinel.
            }
        }, {capture: true});
    }

    ime.addEventListener("beforeinput", (e) => {
        e.preventDefault(); // ImGui owns the text; keep the sentinel in the textarea.

        switch (e.inputType) {
            case "insertText":
                for (const ch of e.data ?? "") {
                    Module.pendingChars.push(ch.codePointAt(0));
                }
                break;
            case "deleteContentBackward":
                Module.pendingKeys.push(1);
                break;
            case "insertLineBreak":
            case "insertParagraph":
                Module.pendingKeys.push(2);
                break;
        }
    });

    // State import picker: Browsers (iOS Safari strictly) open a file dialog only inside a user gesture,
    // so C++ arms it while the menu item is hovered and the real touchend/mouseup handler opens it
    const stateFile = document.getElementById("state-file");
    Module.filePickerArmed = false; // Written by C++ every frame
    Module.pendingImport = null;    // {name, text}, consumed by C++

    const openPickerIfArmed = () => {
        if (Module.filePickerArmed) {
            Module.filePickerArmed = false;
            stateFile.click();
        }
    };
    Module.canvas.addEventListener("touchend", openPickerIfArmed);
    Module.canvas.addEventListener("mouseup", openPickerIfArmed);

    stateFile.addEventListener("change", () => {
        const file = stateFile.files[0];
        stateFile.value = ""; // Picking the same file again must fire "change" again
        if (file) file.text().then((text) => {
            Module.pendingImport = {name: file.name, text};
        });
    });

    // iOS: rotation keeps the old zoom with a fixed-width viewport, and innerWidth/innerHeight update late
    // Re-apply the viewport, then resize again after the layout has settled
    const refitAfterRotation = () => {
        if (smallScreen) {
            viewportMeta.content = "width=800, initial-scale=1, user-scalable=no"; // Different string forces re-evaluation
            applyViewport();
        }
        for (const delay of [0, 150, 500]) {
            setTimeout(() => window.dispatchEvent(new Event("resize")), delay);
        }
    };
    screen.orientation?.addEventListener("change", refitAfterRotation);
    window.addEventListener("orientationchange", refitAfterRotation); // older iOS
</script>

</body>
</html>
