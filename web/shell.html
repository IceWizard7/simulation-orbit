<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- No favico for now -->
    <link rel="icon" href="data:,">

    <!-- GitHub Pages can't send COOP/COEP headers; this service worker adds them (needed for pthreads) -->
    <script src="coi-serviceworker.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <script>
        // Phones: lay out at 800 CSS px and let the browser scale down, so the desktop toolbar fits
        if (Math.min(screen.width, screen.height) < 600) {
            document.querySelector('meta[name="viewport"]').content = "width=800, user-scalable=no";
        }
    </script>

    <!-- Apple add to homescreen features -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>simulation-orbit</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101318;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh; /* fallback for old browsers */
            height: 100dvh; /* visible height on mobile (browser bars included) */
            outline: none;
            touch-action: none;
        }

        #fullscreen {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 1;
            opacity: 0.5;
        }
        #fullscreen:hover { opacity: 1; }
        :fullscreen #fullscreen,
        :-webkit-full-screen #fullscreen { display: none; }   /* Hide while fullscreen; Esc exits */

        #status {
            position: fixed; inset: 0;
            display: grid; place-items: center;
            color: #9aa4b2; font: 14px system-ui, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"
            width="900"
            height="900"
            tabindex="-1"
            oncontextmenu="event.preventDefault()">
    </canvas>

    <div id="status">Loading…</div>

    <button id="fullscreen" title="Fullscreen">⛶</button>

    <script>
        var Module = {
            canvas: document.getElementById("canvas"),

            // simulation-orbit.html?--dt&900&--body-set&all -> argv = ["--dt", "900", "--body-set", "all"]
            arguments: location.search.slice(1).split("&").filter(Boolean).map(decodeURIComponent),
            print: (...args) => console.log(...args),
            printErr: (...args) => console.error(...args),

            onAbort: (reason) => {
                console.error("Simulation aborted:", reason);
            },

            // Emscripten calls this with e.g. "Downloading data... (1234/9000)" and "" when done
            setStatus: (text) => {
                const el = document.getElementById("status");
                el.textContent = text;
                el.hidden = !text;
            },
        };

        Module.wheelDeltaY = 0;
        Module.canvas.addEventListener("wheel", (e) => {
            Module.wheelDeltaY += (e.deltaMode === 0) ? e.deltaY : e.deltaY * 33; // lines -> approx. pixels
        }, { passive: true });

        // Layout-independent zoom keys: Emscripten's GLFW maps by keyCode, and Firefox drops "+" on QWERTZ
        Module.heldKeys = [false, false]; // [zoom in, zoom out]
        const keyActions = { "+": 0, "-": 1 }; // numpad +/- also report e.key "+"/"-"
        const heldByCode = new Map(); // e.code -> action (keyup may report another e.key, e.g. "*")
        window.addEventListener("keydown", (e) => {
            const a = keyActions[e.key];
            if (a !== undefined) { heldByCode.set(e.code, a); Module.heldKeys[a] = true; }
        });
        window.addEventListener("keyup", (e) => {
            const a = heldByCode.get(e.code);
            if (a !== undefined) { heldByCode.delete(e.code); Module.heldKeys[a] = false; }
        });
        window.addEventListener("blur", () => { heldByCode.clear(); Module.heldKeys.fill(false); });

        // Fullscreen: standard API, WebKit prefix (iPad Safari); unsupported on iPhone -> hide the button
        const fullscreenButton = document.getElementById("fullscreen");
        const root = document.documentElement;
        const requestFullscreen = root.requestFullscreen ?? root.webkitRequestFullscreen;

        if (requestFullscreen) {
            fullscreenButton.addEventListener("click", () => requestFullscreen.call(root)?.catch?.(() => {}));
        } else {
            fullscreenButton.hidden = true;
        }

        // Emscripten's GLFW forces the canvas to screen.width * screen.height when entering fullscreen, which exceeds the visible area on displays with a notch
        // A follow-up resize applies the real viewport
        for (const type of ["fullscreenchange", "webkitfullscreenchange"]) {
            document.addEventListener(type, () => {
                requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
            });
        }
    </script>

    <!-- Emscripten placeholder -->
    {{{ SCRIPT }}}
</body>
</html>
